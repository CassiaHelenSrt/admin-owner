<section>
  <h2>{{ title }}</h2>

  <form [formGroup]="form">
    <div *ngFor="let field of fields">
      <input [type]="field.type" [placeholder]="field.placeholder" [formControlName]="field.name" />

      <small *ngIf="form.get(field.name)?.invalid && form.get(field.name)?.touched">
        {{ getErrorMessage(field.name) }}
      </small>
    </div>
  </form>

  <div class="btn">
    <button>Cancelar</button>

    <button (click)="submit()">Editar</button>
  </div>
</section>
