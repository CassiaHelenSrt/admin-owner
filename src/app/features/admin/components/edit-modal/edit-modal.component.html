<section>
  <h2>Editar</h2>

  <form [formGroup]="form">
    <input formControlName="name" placeholder="Nome" />
    <input formControlName="email" placeholder="E-mail" />
    <input formControlName="phone" placeholder="Telefone" />

    <div class="btn">
      <button>Cancelar</button>

      <button (click)="submit()">Editar</button>
    </div>
  </form>
</section>
