<section class="container">
  <div class="title">
    <button class="btn-primary" (click)="openCreateModal()">
      <span class="material-symbols-outlined">add</span> Novo colaborador
    </button>
  </div>

  <app-admin-user-table
    [data]="clients"
    [columns]="clientColumns"
    (edit)="handleEdit($event)"
    (delete)="handleDelete($event)"
  >
  </app-admin-user-table>

  @if (isCreateModalOpen) {
    <app-modal (closeModal)="closeCreateModal()">
      <app-create-modal [title]="'Novo Cliente'" (save)="handleCreate($event)"> </app-create-modal>
    </app-modal>
  }
</section>
